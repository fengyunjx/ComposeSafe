name: release

# Publishes binaries for a tag such as v0.1.0. The tag must point at a commit
# whose `ci` run is green.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Checks
        run: make check
      - name: Build archives
        run: make dist VERSION=${{ github.ref_name }}
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" dist/*.tar.gz dist/SHA256SUMS --title "${{ github.ref_name }}" --generate-notes
